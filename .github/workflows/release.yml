# Release: build the artifacts and attach them to a GitHub release.
#   - Momentum4Control-Setup-<ver>.exe          (Windows, Inno Setup installer, per-user)
#   - Momentum4Control-<ver>-portable.zip       (Windows, self-contained + portable marker)
#   - Momentum4Control-<ver>-linux-x64.tar.gz   (Linux companion with its self-contained shared core)
#   - Momentum4Control-<ver>-linux-arm64.tar.gz
#
# Triggers:
#   - tag v*            -> build + create a GitHub release with all files attached.
#   - workflow_dispatch -> build + upload as workflow artifacts only. Optional version input.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (empty = from Directory.Build.props)"
        required: false
        default: ""

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  package:
    name: setup.exe + portable
    # GitHub only: Gitea falls back to these workflows for mirrored commits without .gitea/, where choco, upload-artifact@v4 etc. are missing.
    if: github.server_url == 'https://github.com'
    runs-on: windows-latest
    # Release signing waits for the manual approval in SignPath (twice: app exes, then setup.exe).
    timeout-minutes: 150
    env:
      # Code signing via SignPath Foundation (see "Code signing policy" in the README). Without the secret the
      # signing steps are skipped and the build stays unsigned, as before.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_PROJECT: momentum-control
      # Tags get the real certificate (manual approval in SignPath), manual runs only the test certificate.
      SIGNPATH_POLICY: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-signing' || 'test-signing' }}
      APP_DIR: ${{ github.workspace }}\stage\app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Determine version
        id: ver
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF.Substring(11) }
          elseif ($env:INPUT_VERSION) { $v = $env:INPUT_VERSION }
          else {
            if ((Get-Content Directory.Build.props -Raw) -notmatch '<Version>([^<]+)</Version>') { throw 'No <Version> in Directory.Build.props.' }
            $v = $Matches[1].Trim()
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish app (Native AOT)
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          .\tools\make-release.ps1 -Stage Publish -AppDir $env:APP_DIR -Version $env:VERSION
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # Only the two own exes; every DLL next to them is already signed by Microsoft.
      - name: Upload app exes for signing
        id: upload-app
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app-exes
          path: |
            stage/app/Momentum4Control.exe
            stage/app/m4ctl.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign app exes (SignPath)
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: stage/signed-app

      - name: Put the signed exes into the app
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: Copy-Item stage\signed-app\*.exe $env:APP_DIR -Force

      - name: Build artifacts (setup.exe + portable.zip)
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          .\tools\make-release.ps1 -Stage Package -AppDir $env:APP_DIR -Dist "$env:GITHUB_WORKSPACE\dist" -Version $env:VERSION
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Upload setup.exe for signing
        id: upload-setup
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: dist/Momentum4Control-Setup-*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign setup.exe (SignPath)
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: stage/signed-setup

      - name: Put the signed setup.exe into dist
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: Copy-Item stage\signed-setup\*.exe dist -Force

      # Fails if signing was on but a file came out unsigned. The test certificate is not trusted, so its status is
      # not "Valid"; only "NotSigned" counts as an error.
      - name: Check signatures
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist\Momentum4Control-Setup-*.exe) + @(Get-Item "$env:APP_DIR\Momentum4Control.exe", "$env:APP_DIR\m4ctl.exe")
          $bad = 0
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            "{0,-40} {1,-14} {2}" -f $f.Name, $s.Status, $s.SignerCertificate.Subject
            if ($env:SIGNPATH_API_TOKEN -and $s.Status -eq 'NotSigned') { $bad++ }
          }
          if ($bad) { throw "$bad file(s) are not signed." }
          Get-ChildItem dist | ForEach-Object { Get-FileHash $_.FullName -Algorithm SHA256 | Format-List Hash, Path }

      # The tray app has no visible window; setup has to end it itself or the upgrade fails on locked files.
      - name: Upgrade over a running app
        shell: pwsh
        run: |
          $setup = (Get-ChildItem "$env:GITHUB_WORKSPACE\dist\Momentum4Control-Setup-*.exe").FullName
          $app = "$env:LOCALAPPDATA\Programs\Momentum 4 Control\Momentum4Control.exe"
          $log = "$env:RUNNER_TEMP\setup.log"
          function Install {
            $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$log" -Wait -PassThru
            if ($p.ExitCode) { Get-Content $log -Tail 40; throw "Setup exit code $($p.ExitCode)." }
          }
          Install
          $old = Start-Process $app -ArgumentList '--minimized' -PassThru
          Start-Sleep 10
          if ($old.HasExited) { throw "The app did not stay running (exit code $($old.ExitCode))." }
          Install
          if (-not $old.HasExited) { throw 'Setup left the running app alive.' }
          Select-String -Path $log -Pattern 'taskkill|in use|Restart Manager' | Select-Object -First 10 | ForEach-Object Line

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Momentum4Control-dist
          path: dist/*
          retention-days: 30

  linux:
    name: Linux archive (${{ matrix.arch }})
    # GitHub only: Gitea falls back to these workflows for mirrored commits without .gitea/, where choco, upload-artifact@v4 etc. are missing.
    if: github.server_url == 'https://github.com'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build and pack archive
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then version=${GITHUB_REF#refs/tags/v}
          elif [ -n "$INPUT_VERSION" ]; then version=$INPUT_VERSION
          else version=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)
          fi
          ./linux/build.sh "$version"
          ./linux/package.sh "$version" "$GITHUB_WORKSPACE/dist"
          sha256sum dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Momentum4Control-linux-${{ matrix.arch }}
          path: dist/*
          retention-days: 30

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Momentum4Control-*
          path: dist
          merge-multiple: true

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "MOMENTUM Control $GITHUB_REF_NAME" \
            --notes "Windows installer (setup.exe) and portable ZIP, plus the Linux companion as tar.gz for x64 and arm64. Built by the release workflow."
